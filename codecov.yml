coverage:
  status:
    project:
      default:
        target: 95%
        threshold: 0%
        informational: false
        if_not_found: failure
    patch:
      default:
        target: 95%
        threshold: 0%
        informational: false
        if_not_found: failure
  ignore:
    - "e2e/**"
    - "src/test/**"
    - "src/**/__tests__/**"
    - "**/*.test.ts"
    - "**/*.spec.ts"
    - "**/*.test.js"
    - "**/*.spec.js"
    - "**/*.config.*"
    - "**/*.d.ts"
    - "dist/**"
    - ".astro/**"
