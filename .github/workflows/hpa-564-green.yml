name: HPA-564 implementation

on:
  push:
    branches:
      - agent/hpa-564-observer-switching
    paths:
      - scripts/apply-hpa-564-green.mjs
      - .github/workflows/hpa-564-green.yml

permissions:
  contents: write

jobs:
  apply-implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hpa-564-observer-switching
      - name: Apply implementation
        run: node scripts/apply-hpa-564-green.mjs
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GalaxyWrapper.svelte \
            src/components/ConstellationWrapper.svelte \
            src/i18n/en.ts src/i18n/zh.ts src/i18n/ja.ts
          git commit -m "feat: expose observer switching"
          git push origin HEAD:agent/hpa-564-observer-switching
