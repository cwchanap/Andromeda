name: HPA-564 red tests

on:
  push:
    branches:
      - agent/hpa-564-observer-switching
    paths:
      - scripts/apply-hpa-564-red.mjs
      - .github/workflows/hpa-564-red.yml

permissions:
  contents: write

jobs:
  apply-red-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hpa-564-observer-switching
      - uses: oven-sh/setup-bun@v2
      - name: Apply failing tests
        run: node scripts/apply-hpa-564-red.mjs
      - name: Commit failing tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/__tests__/GalaxyWrapper.test.ts \
            src/components/__tests__/ConstellationWrapper.observer.test.ts \
            src/i18n/__tests__/observerUiI18nSync.test.ts
          git commit -m "test: define HPA-564 observer switching"
          git push origin HEAD:agent/hpa-564-observer-switching
