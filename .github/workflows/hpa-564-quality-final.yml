name: HPA-564 final quality

on:
  push:
    branches:
      - agent/hpa-564-observer-switching
    paths:
      - .github/workflows/hpa-564-quality-final.yml

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hpa-564-observer-switching
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Type check
        run: bun run type-check
      - name: Lint
        run: bun run lint
      - name: Record success
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: verify HPA-564 typecheck and lint"
          git push