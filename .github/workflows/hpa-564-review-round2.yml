name: HPA-564 review round 2

on:
  push:
    branches:
      - agent/hpa-564-observer-switching
    paths:
      - scripts/apply-hpa-564-review-round2.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hpa-564-observer-switching
      - name: Apply review fixes
        run: node scripts/apply-hpa-564-review-round2.mjs
      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-08-05-hpa-564-observer-switching.md e2e/main-user-journeys.spec.ts e2e/observer-routing.spec.ts src/components/GalaxyWrapper.svelte src/components/__tests__/GalaxyWrapper.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: address HPA-564 overflow and journey review"
          git push