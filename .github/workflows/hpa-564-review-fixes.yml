name: HPA-564 review fixes

on:
  push:
    branches:
      - agent/hpa-564-observer-switching
    paths:
      - scripts/apply-hpa-564-review-fixes.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hpa-564-observer-switching
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: node scripts/apply-hpa-564-review-fixes.mjs
      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GalaxyWrapper.svelte src/components/__tests__/GalaxyWrapper.test.ts docs/superpowers/plans/2026-08-05-hpa-564-observer-switching.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs(ui): resolve HPA-564 hierarchy review"
            git push origin HEAD:agent/hpa-564-observer-switching
          fi
